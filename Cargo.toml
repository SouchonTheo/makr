[package]
name = "makr"
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
description = "A fast, interactive TUI for exploring and running Makefile targets"
authors = ["Theo Souchon"]
license = "MIT"
repository = "https://github.com/SouchonTheo/makr"
readme = "README.md"
keywords = ["make", "makefile", "tui", "terminal"]
categories = ["command-line-utilities", "development-tools"]

[profile.release]
lto = true

[dependencies]
ratatui = "0.30.0"
crossterm = "0.29"

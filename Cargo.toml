[package]
name = "makr"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "A fast, interactive TUI for exploring and running Makefile targets"
authors = ["Theo Souchon"]
license = "MIT"
repository = "https://github.com/SouchonTheo/makr"
readme = "README.md"
keywords = ["make", "makefile", "tui", "terminal"]
categories = ["command-line-utilities", "development-tools"]
# Keep the published crate small: no demo GIF, CI config or templates.
include = ["/src", "/test_makefiles", "/README.md", "/LICENSE", "/Cargo.lock"]

# Lets `cargo binstall makr` download the prebuilt release archives.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }{ archive-suffix }"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[profile.release]
lto = true
strip = true
codegen-units = 1

[dependencies]
ratatui = "0.30.0"
crossterm = "0.29"
clap = { version = "4.6.7", features = ["derive"] }

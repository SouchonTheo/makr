# git-cliff config: turns conventional commits (feat:, fix:, …) into the
# release notes of each GitHub release. Used by .github/workflows/release.yml.

[changelog]
header = ""
body = """
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }} ({{ commit.id | truncate(length=7, end="") }})
{%- endfor %}
{% endfor %}
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Bug fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^doc", group = "<!-- 3 -->Documentation" },
  { message = "^chore\\(release\\)", skip = true },
  { message = "^(ci|build)", group = "<!-- 5 -->CI & build" },
  { message = ".*", group = "<!-- 4 -->Other changes" },
]
tag_pattern = "v[0-9].*"
